# Examples: property-level only. Renderers synthesize the object and list samples from
# those and honor readOnly/writeOnly while doing so.
components:
  parameters:
    networkAccessDeviceId:
      name: networkAccessDeviceId
      in: path
      description: |
        The unique identifier of the Network Access Device. If the device exists but the caller lacks permission to access it, the API returns 403.

        Must be a valid UUID as defined by RFC 4122 (versions 1-5) using only lowercase hexadecimal characters.
      required: true
      schema:
        $ref: "../NAM_Common.yaml#/components/schemas/Uuid"
  schemas:
    NetworkAccessDevice:
      description: |
        Represents a network access device managed through the Network Access Devices API.
        This schema represents operator-supplied network access equipment (e.g., gateways, mesh Wi-Fi systems).
        It extends the Commonalities Device model but MUST NOT be confused with end-user devices.
        The identifiers and addressing fields reflect the operator-managed equipment, not client equipment.
      allOf:
        - $ref: "../NAM_Common.yaml#/components/schemas/ResourceIdentifier"
        - $ref: "../../common/CAMARA_common.yaml#/components/schemas/Device"
        # No readOnly overlay for `id`: ResourceIdentifier.id already declares it, and a
        # bare `readOnly: true` stub wins the allOf merge and blanks the property to null
        # in generated samples.
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
              description: The name of the device
              example: "Gateway-1"
            description:
              type: string
              minLength: 0
              maxLength: 255
              description: A description of the device
              example: "A Wi-Fi gateway device"
            hardwareAddress:
              description: The hardware address of the device
              oneOf:
                - type: object
                  properties:
                    hardwareAddressType:
                      type: string
                      enum: ["EUI-48"]
                      example: "EUI-48"
                    value:
                      type: string
                      pattern: "^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$"
                      maxLength: 17
                      example: "12:34:56:78:9A:BC"
                  required:
                    - hardwareAddressType
                    - value
              discriminator:
                propertyName: hardwareAddressType
            serviceSite:
              $ref: "../Services/ServiceSites.yaml#/components/schemas/ServiceSite"
            deviceStatus:
              type: string
              enum:
                - connected
                - disconnected
                - unavailable
              default: unavailable
              description: The current status of the device
              example: "connected"

    NetworkAccessDeviceList:
      type: array
      description: A list of network access devices.
      items:
        $ref: "#/components/schemas/NetworkAccessDevice"
      maxItems: 100

  examples:
    NetworkAccessDeviceListResponse:
      summary: List of network access devices
      description: |
        Two operator-supplied devices at the same service site, one connected and one
        disconnected.
      value:
        - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          name: "Gateway-1"
          description: "A Wi-Fi gateway device"
          deviceStatus: "connected"
          hardwareAddress:
            hardwareAddressType: "EUI-48"
            value: "12:34:56:78:9A:BC"
          serviceSite:
            id: "123e4567-e89b-12d3-a456-426614174000"
            name: "Primary Residence"
            description: "123 Main Street"
        - id: "123e4567-e89b-12d3-a456-426614174001"
          name: "Gateway-2"
          description: "Another Wi-Fi gateway device"
          deviceStatus: "disconnected"
          hardwareAddress:
            hardwareAddressType: "EUI-48"
            value: "AB:CD:EF:12:34:56"
          serviceSite:
            id: "123e4567-e89b-12d3-a456-426614174000"
            name: "Primary Residence"
            description: "123 Main Street"
